# .gitlab-ci.yml
# ВАЖНО: раннер использует executor = "shell", поэтому все шаги выполняются
# напрямую на хосте (WSL2) под пользователем gitlab-runner.
# Java 17+, Maven, Docker и kubectl должны быть установлены и доступны
# именно в PATH этого пользователя — проверяется через:
#   sudo -u gitlab-runner bash -c 'java -version && mvn -version && docker -v && kubectl version --client'

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B"
  DOCKER_IMAGE: "localhost:4000/${CI_PROJECT_NAME}"
  DOCKER_TAG: "${CI_COMMIT_SHORT_SHA}"
  KUBE_NAMESPACE: "default"

stages:
  - build
  - test
  - package
  - docker
  - deploy

cache:
  key:
    files:
      - pom.xml
  paths:
    - .m2/repository
  policy: pull-push

# BUILD
build:
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS compile
  artifacts:
    paths:
      - target/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG

# TEST
test:
  stage: test
  needs: ["build"]
  script:
    - mvn $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG

# PACKAGE (jar)
package:
  stage: package
  needs: ["test"]
  script:
    - mvn $MAVEN_CLI_OPTS package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG

# DOCKER BUILD & PUSH
docker-build:
  stage: docker
  needs: ["package"]
  tags:
    - shell
  script:
    - docker build -t $DOCKER_IMAGE:$DOCKER_TAG -t $DOCKER_IMAGE:latest .
    - docker push $DOCKER_IMAGE:$DOCKER_TAG
    - docker push $DOCKER_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG

# DEPLOY to k3s
deploy:
  stage: deploy
  needs: ["docker-build"]
  script:
    - kubectl config use-context $KUBE_CONTEXT
    - kubectl set image deployment/backend backend=$DOCKER_IMAGE:$DOCKER_TAG -n $KUBE_NAMESPACE
    - kubectl rollout status deployment/backend -n $KUBE_NAMESPACE
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - if: $CI_COMMIT_TAG
      when: manual